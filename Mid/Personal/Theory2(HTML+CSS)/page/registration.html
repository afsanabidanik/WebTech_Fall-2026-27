<!DOCTYPE html>
<html lang="eng-US">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, inital-scale= 1.0">
        <link rel="stylesheet" href="../design/style.css">
        <title>Registration Page</title>
    </head>

    <div class="container">
    <body>
        <img src="logo.png" alt="logo" id="logo">

        <div class="header">
            <h1>Student Registration Form</h1>
        </div>

        <div class="topnav">
            <a href="https://aiub.edu/">AIUB Home</a>
            <a href="https://portal.aiub.edu/">AIUB Portal</a>
        </div>

        <br>

        <form action="">
            <fieldset>
                <legend>Student Information</legend>
                <table>
                    <tr>
                        <td><label for="StudentName">Student Name : </label></td>
                        <td><input type="text" name="StudentName" id="StudentName" placeholder="Enter Your Name" required></td>
                    </tr>

                    <tr>
                        <td><label for="StudentAge">Student Age : </label></td>
                        <td><input type="number" name="StudentAge" id="StudentAge" placeholder="Enter Your Age"></td>
                    </tr>

                    <tr>
                        <td><label for="StudentEmail">Student Email : </label></td>
                        <td><input type="Email" name="StudentEmail" id="StudentEmail" placeholder="Enter Your Email" required></td>
                    </tr>

                    <tr>
                        <td><label for="StudentPhn">Phone Number :</label></td>
                        <td><input type="text" name="StudentPhn" id="StudentPhn"></td>
                    </tr>

                    <tr>
                        <td><label for="Gender"> Gender : </label></td>
                        <td>
                            <input type="radio" name="gender" id="male"> Male
                            <input type="radio" name="gender" id="female"> Female
                        </td>
                    </tr>

                    <tr>
                        <td><label for="DOB">Date of Birth : </label></td>
                        <td><input type="date" name="DOB" id="dob"></td>
                    </tr>

                    <tr>
                        <td><label for="Address">Address : </label></td>
                        <td><textarea name="Address" id="Address" style="resize: none;"></textarea></td>
                    </tr>

                    <tr>
                        <td><label for="Citizen">Citizen : </label></td>
                        <td>
                            <select>
                                <option id="blank">Select Country</option>
                                <option id="BD">Bangladesh</option>
                                <option id="USA">USA</option>
                                <option id="UK">UK</option>
                                <option id="JP">Japan</option>
                            </select>
                        </td>
                    </tr>

                    <tr>
                        <td><label for="Dept">Select Department : </label></td>
                        <td>
                            <input type="checkbox" name="dept" id="CSE"> CSE
                            <input type="checkbox" name="dept" id="EEE"> EEE
                            <input type="checkbox" name="dept" id="BBA"> BBA
                            <input type="checkbox" name="dept" id="LLB"> LLB
                        </td>
                    </tr>

                    <tr>
                        <td><label for="Picture">Student Photo : </label></td>
                        <td><input type="file" name="Picture" id="StudentPic"></td>
                    </tr>

                </table>
            </fieldset>


            <br>

            <fieldset>
                <legend>User Info </legend>
                <table>
                    <tr>
                        <td><label for="username">User Name : </label></td>
                        <td><input type="text" for="username" id="username"></td>
                    </tr>


                    <tr>
                        <td><label for="password">Password : </label></td>
                        <td><input type="password" for="password" id="password"></td>
                    </tr>


                </table>
            </fieldset>
            <br>

            <input type="submit" id="submit" for="submit" value="Signup">
            <input type="reset" id="reset" for="reset" value="Reset">

        </form>
        </div>

        <div class="footer">
            <h5>Created By MD Afsan Abid</h5>
        </div>

    </body>
</html>
